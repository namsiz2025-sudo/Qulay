<!DOCTYPE html><html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qulay</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .hero {
      padding: 60px 20px;
      text-align: center;
      background: white;
    }
    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .hero p {
      color: #666;
      font-size: 18px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
    .services {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body><header>Qulay</header><section class="hero">
  <h1>Qulay غا خۇش كەلدىڭىز!</h1>
  <p>قولاي ۋە زامانىۋى تور مۇلازىمىتى</p>
  <a class="btn" href="#services">باشلاش</a>
</section><section class="services" id="services">
  <div class="card">
    <h2>🛍️ دۇكان</h2>
    <p>مەھسۇلاتلارنى كۆرۈش ۋە سېتىۋېلىش.</p>
  </div>  <div class="card">
    <h2>📦 زاكازلار</h2>
    <p>زاكازلىرىڭىزنى باشقۇرۇڭ.</p>
  </div>  <div class="card">
    <h2>💳 ھەق تۆلەش</h2>
    <p>قولاي ھەق تۆلەش مۇلازىمىتى.</p>
  </div>  <div class="card">
    <h2>👤 ھېسابات</h2>
    <p>شەخسىي ئۇچۇرلىرىڭىزنى باشقۇرۇڭ.</p>
  </div>
</section><footer>
  © 2026 Qulay — بارلىق ھوقۇقلار قوغدىلىدۇ
</footer></body>
</html>
