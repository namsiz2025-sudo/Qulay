
<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العربية بين يدي أولادنا - 2</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px;color:#172033}
.container{max-width:650px;margin:auto;background:white;padding:20px;border-radius:15px}
h2{text-align:center;color:#166534}
.question{padding:15px;margin:12px 0;background:#f8fafc;border:1px solid #ddd;border-radius:10px}
button{padding:12px;border:0;border-radius:8px;background:#15803d;color:white;font-size:17px;width:100%;margin-top:12px}
label{display:block;padding:8px;cursor:pointer}
#result{font-size:22px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h2>العربية بين يدي أولادنا</h2>
<h3>الكتاب الثاني - امتحان 100 سؤال</h3>
<p>بۇ ئىمتىھان 100 سوئالدىن تەركىب تاپقان.</p>
<div id="quiz"></div>
<button onclick="finish()">ئىمتىھاننى تاپشۇرۇش</button>
<div id="result"></div>
</div>
<script>
const questions=[
["مَا مَعْنَى كِتَابٌ؟","كىتاب","قەلەم","ئۆي",0],
["مَا مَعْنَى مَدْرَسَةٌ؟","ئۆي","مەكتەپ","بازار",1],
["مَا مَعْنَى مُعَلِّمٌ؟","ئوقۇتقۇچى","ئوقۇغۇچى","دوست",0],
["مَا مَعْنَى طَالِبٌ؟","دادا","ئوقۇغۇچى","ئانا",1],
["مَا مَعْنَى قَلَمٌ؟","كىتاب","قەلەم","دەرس",1],
["مَا مَعْنَى بَيْتٌ؟","ئۆي","مەكتەپ","يول",0],
["مَا مَعْنَى صَدِيقٌ؟","دوست","ئوقۇتقۇچى","دادا",0],
["مَا مَعْنَى جَدِيدٌ؟","كونا","يېڭى","چوڭ",1],
["مَا مَعْنَى صَغِيرٌ؟","كىچىك","چوڭ","ئۇزۇن",0],
["مَا مَعْنَى كَبِيرٌ؟","كىچىك","چوڭ","يېڭى",1]
];
const all=[];
for(let i=0;i<100;i++) all.push(questions[i%questions.length]);
const quiz=document.getElementById("quiz");
all.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question";
div.innerHTML=`<b>${i+1}. ${q[0]}</b>`;
q.slice(1,4).forEach((a,j)=>{
div.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}"> ${["أ","ب","ج"][j]}) ${a}</label>`;
});
quiz.appendChild(div);
});
function finish(){
let score=0;
all.forEach((q,i)=>{
let selected=document.querySelector(`input[name="q${i}"]:checked`);
if(selected && Number(selected.value)===q[4])score++;
});
document.getElementById("result").innerHTML=
`سىزنىڭ نەتىجىڭىز: ${score} / 100`;
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
